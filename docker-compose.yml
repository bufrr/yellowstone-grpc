version: '3.8'

services:
  dex-router-monitor:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dex-router-monitor
    restart: unless-stopped
    
    # Command (values are typically provided via .env)
    command: [
      "--endpoint", "${ENDPOINT:-http://127.0.0.1:10000}",
      "--router-address", "${ROUTER_ADDRESS:-675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8}",
      "--x-token", "${X_TOKEN:-}",
      "--log-file", "/app/logs/dex-transactions.log"
    ]
    
    # Persist logs on host (optional)
    volumes:
      - ./logs:/app/logs
    
    # Network mode for local gRPC server access
    network_mode: "host"
    
    # Resource limits (optional; docker compose ignores 'deploy' on single host)
    
    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "dex-router-monitor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
